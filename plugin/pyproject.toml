# Runtime of the Claude plugin: pins at-eli-mcp and every transitive dependency
# (with hashes) in uv.lock, so the plugin runs exactly what was reviewed.
# Started by plugin.json as: uvx at-eli-mcp==0.4.3 (Claude Code's locked launch reads this uv.lock)
[project]
name = "at-eli-mcp-plugin-runtime"
version = "0.4.3"
requires-python = ">=3.11,<3.14"
dependencies = ["at-eli-mcp==0.4.3"]

[tool.uv]
package = false
